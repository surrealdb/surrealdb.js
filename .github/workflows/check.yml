name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Checking Code Quality
        run: bun run qc

  typecheck:
    name: Typecheck
    needs:
      - build-sdk
      - build-memory
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: ["~5.8.0", "~6.0.0"]
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun install

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Download Agent Memory build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: memory-build
          path: packages/memory/dist/

      - name: Install TypeScript ${{ matrix.typescript }}
        run: bun add --dev typescript@${{ matrix.typescript }}

      - name: Typecheck SDK types
        run: bunx tsc --noEmit --project packages/tests/surrealdb/typecheck/tsconfig.json

      - name: Typecheck Agent Memory consumer
        run: bunx tsc --noEmit --project packages/tests/memory/typecheck/tsconfig.json

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-sdk-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/sdk/src/**') }}
          restore-keys: turbo-sdk-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun ci

      - name: Build SDK
        run: bun run build:sdk

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-build
          retention-days: 1
          path: packages/sdk/dist/

  build-memory:
    name: Build Agent Memory
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-memory-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/memory/src/**', 'packages/memory/spec/**') }}
          restore-keys: turbo-memory-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install

      - name: Build Agent Memory
        run: bun run build:memory

      - name: Upload Agent Memory artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-build
          retention-days: 1
          path: packages/memory/dist/

  build-wasm:
    name: Build WASM
    needs: build-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-wasm-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/wasm/src-ts/**') }}
          restore-keys: turbo-wasm-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun ci

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Build WASM
        run: bun run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-build
          retention-days: 30
          path: packages/wasm/dist/

  build-node:
    name: Build Node
    needs: build-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-node-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/node/src-ts/**') }}
          restore-keys: turbo-node-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun ci

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Build Node
        run: bun run build:node

      - name: Upload Node artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-build
          retention-days: 30
          path: packages/node/dist/

  expo:
    name: Expo
    needs: build-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      # demo/expo resolves `surrealdb` through the workspace symlink to
      # packages/sdk/dist, so both steps below need the built SDK, not the sources.
      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      # Typechecks against dist/surrealdb.d.ts, exactly as a consumer would, rather
      # than against the sources the root tsconfig `paths` would otherwise redirect to.
      - name: Typecheck Expo demo
        run: bun run qts:expo

      # The real guard. Bundling through Metro proves the SDK still resolves under
      # React Native's export conditions (a `node:` import reachable from
      # src/index.ts would leak into the primary bundle and fail here), and the
      # Hermes bytecode compile proves hermesc accepts every construct the SDK emits.
      #
      # iOS only: Metro's platform choice does not change SDK resolution, Babel
      # transforms or the hermesc pass, so a second platform would only add minutes.
      - name: Bundle Expo demo for Hermes
        run: bun run --cwd demo/expo bundle
        env:
          EXPO_NO_TELEMETRY: "1"

      # `expo export` silently emits plain JavaScript if bytecode generation is
      # skipped, which would weaken the step above without failing it. Assert the
      # output really is Hermes bytecode by checking for its magic number.
      - name: Verify Hermes bytecode was produced
        run: |
          bundle=$(ls demo/expo/dist/_expo/static/js/ios/*.hbc 2>/dev/null | head -n 1)

          if [ -z "$bundle" ]; then
            echo "::error::No .hbc bundle found - Hermes bytecode was not generated."
            ls -R demo/expo/dist || true
            exit 1
          fi

          magic=$(head -c 4 "$bundle" | od -An -tx1 | tr -d ' \n')

          if [ "$magic" != "c61fbc03" ]; then
            echo "::error::$bundle is not Hermes bytecode (magic: $magic)."
            exit 1
          fi

          echo "Hermes bytecode verified: $bundle"

  test:
    name: Test
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surrealdb: ["v2.2.7", "v2.3.7", "v3.0.0", "nightly"]
        engine: ["ws", "http"]
    steps:
      - name: Install SurrealDB ${{ matrix.surrealdb }} over ${{ matrix.engine }} engine
        run: |
          if [ "${{ matrix.surrealdb }}" = "nightly" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://install.surrealdb.com | sh -s -- --nightly
          else
            curl --proto '=https' --tlsv1.2 -sSf https://install.surrealdb.com | sh -s -- --version ${{ matrix.surrealdb }}
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Run tests
        run: cd packages/tests/surrealdb && bun test --preload ./global.ts --reporter=junit --reporter-outfile=junit.xml
        env:
          SURREAL_PROTOCOL: ${{ matrix.engine }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@49b2ca06f62aa7ef83ae6769a2179271e160d8e4 # v6.3.1
        if: success() || failure()
        with:
          report_paths: packages/tests/surrealdb/junit.xml
          check_name: Test Report (${{ matrix.surrealdb }} / ${{ matrix.engine }})
          detailed_summary: true
          include_passed: false
          include_skipped: false
          group_suite: true
          skip_success_summary: true

  test-wasm:
    name: Test WASM
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Download WASM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-build
          path: packages/wasm/dist/

      - name: Run WASM tests
        run: cd packages/tests/surrealdb && SURREAL_BACKEND=wasm bun test --preload ./global-wasm.ts --reporter=junit --reporter-outfile=junit.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@49b2ca06f62aa7ef83ae6769a2179271e160d8e4 # v6.3.1
        if: success() || failure()
        with:
          report_paths: packages/tests/surrealdb/junit.xml
          check_name: Test Report (WASM)
          detailed_summary: true
          include_passed: false
          include_skipped: false
          group_suite: true
          skip_success_summary: true

  test-node:
    name: Test Node
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-build
          path: packages/sdk/dist/

      - name: Download Node build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-build
          path: packages/node/dist/

      - name: Run Node tests
        run: cd packages/tests/surrealdb && SURREAL_BACKEND=node bun test --preload ./global-node.ts --reporter=junit --reporter-outfile=junit.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@49b2ca06f62aa7ef83ae6769a2179271e160d8e4 # v6.3.1
        if: success() || failure()
        with:
          report_paths: packages/tests/surrealdb/junit.xml
          check_name: Test Report (Node)
          detailed_summary: true
          include_passed: false
          include_skipped: false
          group_suite: true
          skip_success_summary: true

  test-memory:
    name: Test Agent Memory
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun install

      - name: Run Agent Memory tests
        run: cd packages/tests/memory && bun test --reporter=junit --reporter-outfile=junit.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@49b2ca06f62aa7ef83ae6769a2179271e160d8e4 # v6.3.1
        if: success() || failure()
        with:
          report_paths: packages/tests/memory/junit.xml
          check_name: Test Report (Agent Memory)
          detailed_summary: true
          include_passed: false
          include_skipped: false
          group_suite: true
          skip_success_summary: true
