name: Publish SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no actual publishing)"
        required: false
        default: false
        type: boolean
      continue:
        description: "Continue publishing even if some packages fail"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  # Validate versions first
  validate:
    name: Validate Versions
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Validate package versions
        run: bun run validate:versions ${{ github.event.inputs.version }}

  # Build SDK package
  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Build SDK
        run: bun run build:sdk

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-artifacts
          retention-days: 1
          path: packages/sdk/dist/

  # Dry run publish to verify everything works
  dry-run-publish:
    name: Dry Run Publish
    runs-on: ubuntu-latest
    needs:
      - build-sdk
      - validate
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-artifacts
          path: packages/sdk/dist/

      - name: Distribution summary
        run: |
          tree packages/sdk -I src

      - name: Dry run publish all packages
        run: bun run deploy:sdk --dry-run ${{ github.event.inputs.continue == 'true' && '--continue' || '' }}

  # Dry run JSR publish. JSR ships the TypeScript sources described by
  # packages/sdk/jsr.json rather than the build, so this needs no SDK artifacts.
  dry-run-jsr:
    name: Dry Run JSR Publish
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: ${{ github.event.inputs.continue == 'true' }}
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      # The sources import @surrealdb/sqon through the workspace symlink. JSR rewrites
      # that import to npm:@surrealdb/sqon@^<version>, but reads the built package first.
      - name: Build SQON
        run: bun run build:sqon

      # The version comes from package.json, so jsr.json never needs a version bump.
      - name: Dry run JSR publish
        working-directory: packages/sdk
        run: bunx jsr@0.14.3 publish --dry-run --allow-slow-types --set-version "$(jq -r .version package.json)"

  # Actual publish (only if not dry run)
  publish:
    name: Publish Packages
    if: ${{ !github.event.inputs.dry_run || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    needs:
      - build-sdk
      - validate
      - dry-run-publish
      - dry-run-jsr
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-artifacts
          path: packages/sdk/dist/

      - name: Publish all packages
        run: bun run deploy:sdk ${{ github.event.inputs.continue == 'true' && '--continue' || '' }}

  # Publish to JSR after npm, so JSR never gets a version npm does not have. Runs as
  # its own job so a failure here can be re-run without publishing to npm again.
  # Authenticates with the GitHub OIDC token (id-token: write), so it needs no secret.
  publish-jsr:
    name: Publish to JSR
    if: ${{ !github.event.inputs.dry_run || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: ${{ github.event.inputs.continue == 'true' }}
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Build SQON
        run: bun run build:sqon

      - name: Publish to JSR
        working-directory: packages/sdk
        run: bunx jsr@0.14.3 publish --allow-slow-types --set-version "$(jq -r .version package.json)"
