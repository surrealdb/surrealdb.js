name: Publish Surreal

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no actual publishing)"
        required: false
        default: false
        type: boolean
      continue:
        description: "Continue publishing even if some packages fail"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  # Validate versions first
  validate:
    name: Validate Versions
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Validate package versions
        run: bun run validate:versions

  # Build WASM package. The WebAssembly itself ships in @surrealdb/wasm-native,
  # so there is nothing to compile here and no per-platform matrix to fan out.
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs:
      - validate
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Build WASM
        run: bun run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-artifacts
          retention-days: 1
          if-no-files-found: error
          path: packages/wasm/dist/

  # Build Node package. The addon ships in @surrealdb/node-native, which carries
  # its own platform binaries, so this is one plain bundle for every target.
  build-node:
    name: Build Node
    runs-on: ubuntu-latest
    needs:
      - validate
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Build Node
        run: bun run build:node

      - name: Upload Node artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-artifacts
          retention-days: 1
          if-no-files-found: error
          path: packages/node/dist/

  # Dry run publish to verify everything works
  dry-run-publish:
    name: Dry Run Publish
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-wasm
      - build-node
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-artifacts
          path: packages/wasm/dist/

      - name: Download Node artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-artifacts
          path: packages/node/dist/

      - name: Distribution summary
        run: |
          echo "::group::Wasm tree"
          tree packages/wasm -I "src-ts"
          echo "::endgroup::"

          echo "::group::Node tree"
          tree packages/node -I "src-ts"
          echo "::endgroup::"

      - name: Dry run publish all packages
        run: bun run deploy:surreal --dry-run ${{ github.event.inputs.continue == 'true' && '--continue' || '' }}

  # Actual publish (only if not dry run)
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-wasm
      - build-node
      - dry-run-publish
    if: ${{ !github.event.inputs.dry_run || github.event.inputs.dry_run == 'false' }}
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Code Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun ci

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-artifacts
          path: packages/wasm/dist/

      - name: Download Node artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-artifacts
          path: packages/node/dist/

      - name: Publish all packages
        run: bun run deploy:surreal ${{ github.event.inputs.continue == 'true' && '--continue' || '' }}
